aid: buglabs
name: Bug Labs
description: >-
  Bug Labs is a New York City enterprise software company founded in 2006, first as one of the
  earliest open-source modular hardware makers and later as an enterprise IoT platform provider
  serving Fortune 500 customers including Verizon, Comcast, VMware, Ford, Charter and Orange. Its
  current flagship product, Signalpattern, targets workflow fragmentation by mapping and connecting
  dispersed enterprise systems, automating cross-system tasks, and letting users interact with APIs
  directly without writing code. Bug Labs previously operated the well-known public IoT APIs
  dweet.io, dweetpro.io and freeboard.io; all three are decommissioned and the company publishes no
  developer portal, API documentation or public API today. Backed by Union Square Ventures, Spark
  Capital and Court Square Ventures.
